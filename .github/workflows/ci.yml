name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # A throwaway database so `prisma generate` and the build have a URL.
      DATABASE_URL: file:./ci.db
      NFL_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Seed a database and build
        run: |
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts
          npm run build
